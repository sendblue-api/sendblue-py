name: Publish PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify or recover
        type: string
        required: true
concurrency:
  group: publish-pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: Verify tag checkout
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          test -n "$TAG"
          git check-ref-format "refs/tags/$TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
      - name: Install Rye
        env:
          RYE_VERSION: '0.44.0'
          RYE_INSTALL_OPTION: '--yes'
        run: |
          curl -sSf https://rye.astral.sh/get | bash
          echo "$HOME/.rye/shims" >> "$GITHUB_PATH"
      # Publisher verification needs tomllib, independent of the SDK Python floor.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Publish or verify exact distribution files
        env:
          PYPI_TOKEN: ${{ secrets.SENDBLUE_API_PYPI_TOKEN || secrets.PYPI_TOKEN }}
        run: bash bin/publish-pypi
      - uses: actions/create-github-app-token@v3
        id: docs
        with:
          app-id: ${{ vars.STLC_APP_ID }}
          private-key: ${{ secrets.STLC_APP_PRIVATE_KEY }}
          owner: sendblue-api
          repositories: sendblue-api-docs
      - name: Refresh docs after verified publication
        env:
          GH_TOKEN: ${{ steps.docs.outputs.token }}
        run: gh workflow run deploy.yml --repo sendblue-api/sendblue-api-docs --ref main
